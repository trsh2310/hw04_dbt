name: mlops-hw04-dbt
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3.14.14
    ports:
      - "127.0.0.1:${CLICKHOUSE_PORT:-18124}:8123"
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: [CMD, clickhouse-client, --query, SELECT 1]
      interval: 3s
      timeout: 3s
      retries: 30
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
volumes:
  clickhouse_data:
