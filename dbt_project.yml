name: fraud_analytics
version: '1.0.0'
config-version: 2
profile: fraud_analytics
require-dbt-version: [">=1.10.0", "<1.11.0"]
model-paths: [models]
macro-paths: [macros]
test-paths: [tests]
seed-paths: [seeds]
clean-targets: [target, dbt_packages]
vars:
  'dbt_date:time_zone': UTC
  large_amount_threshold: 1000
  medium_amount_threshold: 100
  customer_high_risk_rate: 5
  customer_medium_risk_rate: 1
  suspicious_merchant_rate: 5
  suspicious_merchant_min_transactions: 100
models:
  fraud_analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    marts:
      +materialized: table
      +engine: MergeTree()
seeds:
  fraud_analytics:
    states:
      +column_types:
        us_state: String
        state_name: String
dispatch:
  - macro_namespace: dbt_date
    search_order: [fraud_analytics, dbt_date]
