fraud_analytics:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: "{{ env_var('CLICKHOUSE_SCHEMA', 'fraud_analytics') }}"
      host: "{{ env_var('CLICKHOUSE_HOST', '127.0.0.1') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '18124') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      secure: false
      threads: 4
      connect_timeout: 10
      send_receive_timeout: 300
      custom_settings:
        session_timezone: UTC
        join_use_nulls: 1
